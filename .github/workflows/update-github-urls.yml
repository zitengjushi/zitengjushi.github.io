name: 每日更新订阅时间、mytv、lxmusic
on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动运行
    - cron: "0 2 * * *"
  workflow_dispatch:   # 支持手动触发
permissions:
  contents: write
jobs:
  update-github-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run update script
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_github_urls.py
      - name: Run jingdian check script
        id: jingdian
        run: python script/update_jingdian_urls.py jingdian.json
      - name: Sync mytv-android latest APKs to apk/tv.json
        id: mytv_android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_mytv_android.py
      - name: Sync TVBoxOSC latest APKs to apk/tvbox.json
        id: tvbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_tvbox.py
      - name: Sync lxmusic- latest release folder into lx
        id: lxsync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="guoyue2010/lxmusic-"

          # 1. 获取最新一次 release 的 tag 和 zip 下载地址
          LATEST_TAG=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name')
          ZIP_URL=$(gh api "repos/$REPO/releases/latest" \
            --jq '[.assets[] | select(.name | endswith(".zip"))][0].browser_download_url')
          echo "最新 release: $LATEST_TAG"

          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "⚠ 最新 release ($LATEST_TAG) 中没有找到 zip 文件，跳过同步。"
            exit 0
          fi

          # 2. 目标文件夹：lx/<LATEST_TAG>，已存在就说明上传过了，直接跳过
          mkdir -p lx
          DEST="lx/$LATEST_TAG"
          if [ -d "$DEST" ]; then
            echo "✔ lx/$LATEST_TAG 已存在，说明该 release 已上传过，无需更新。"
            exit 0
          fi
          echo "发现新版本: $LATEST_TAG，准备下载。"

          # 3. 下载并解压
          rm -rf /tmp/lx-release /tmp/lx-release.zip
          mkdir -p /tmp/lx-release
          curl -fL --retry 3 -o /tmp/lx-release.zip "$ZIP_URL"
          unzip -q /tmp/lx-release.zip -d /tmp/lx-release

          # 4. 如果压缩包里只有一个顶层文件夹（如 V260926），就用它作为要上传的整体文件夹；
          #    否则把解压出的所有内容当作这个 release 的文件夹内容（忽略 __MACOSX）
          SRC=/tmp/lx-release
          mapfile -t ENTRIES < <(find /tmp/lx-release -mindepth 1 -maxdepth 1 ! -name "__MACOSX")
          if [ "${#ENTRIES[@]}" -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
            SRC="${ENTRIES[0]}"
          fi

          # 5. 把整个文件夹放进 lx/<LATEST_TAG>，不触碰 lx 目录下的其他已有内容
          mkdir -p "$DEST"
          cp -a "$SRC"/. "$DEST"/

          rm -rf /tmp/lx-release /tmp/lx-release.zip
          echo "已将 $LATEST_TAG 上传到 $DEST"
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain github.json jingdian.json jingdian_md5.json apk/tv.json apk/tvbox.json lx)" ]; then
            echo "updated=1" >> "$GITHUB_OUTPUT"
          else
            echo "updated=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push changes
        if: steps.changes.outputs.updated == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github.json jingdian.json jingdian_md5.json apk/tv.json apk/tvbox.json lx
          git commit -m "chore: 自动更新订阅源最后修改时间及链接可用性，同步mytv-android/TVBoxOSC最新APK，同步lxmusic-最新release [skip ci]"
          git push
      - name: No changes
        if: steps.changes.outputs.updated == '0'
        run: echo "✔ 所有订阅源均为最新，无需提交。"
