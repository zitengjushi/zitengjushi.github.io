name: 每日更新 github.json 订阅时间
on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）自动运行
    - cron: "0 2 * * *"
  workflow_dispatch:   # 支持手动触发
permissions:
  contents: write
jobs:
  update-github-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run update script
        id: updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_github_urls.py
      - name: Run jingdian check script
        id: jingdian
        run: python script/update_jingdian_urls.py jingdian.json
      - name: Sync mytv-android latest APKs to apk/tv.json
        id: mytv_android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_mytv_android.py
      - name: Sync TVBoxOSC latest APKs to apk/tvbox.json
        id: tvbox
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/update_tvbox.py
      - name: Sync lxmusic- repo to lx folder
        id: lxsync
        run: |
          set -e
          rm -rf /tmp/lxmusic-src
          # 只拉取最新一次提交，不带历史记录，速度更快
          git clone --depth 1 https://github.com/guoyue2010/lxmusic-.git /tmp/lxmusic-src
          mkdir -p lx
          # 用rsync同步全部文件到lx目录，--delete表示源仓库里删掉的文件本地也同步删除，
          # 排除.git目录，避免把上游仓库自己的git记录也同步进来
          rsync -av --delete --exclude=".git" /tmp/lxmusic-src/ lx/
          rm -rf /tmp/lxmusic-src
      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain github.json jingdian.json apk/tv.json apk/tvbox.json lx)" ]; then
            echo "updated=1" >> "$GITHUB_OUTPUT"
          else
            echo "updated=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and push changes
        if: steps.changes.outputs.updated == '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github.json jingdian.json apk/tv.json apk/tvbox.json lx
          git commit -m "chore: 自动更新订阅源最后修改时间及链接可用性，同步mytv-android/TVBoxOSC最新APK，同步lxmusic-最新文件 [skip ci]"
          git push
      - name: No changes
        if: steps.changes.outputs.updated == '0'
        run: echo "✔ 所有订阅源均为最新，无需提交。"
