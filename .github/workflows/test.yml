name: Sync APK Files

on:
  # 允许手动触发
  workflow_dispatch:
  # 可选：设置每天定时自动同步一次（例如每天北京时间 0点）
  schedule:
    - cron: '0 16 * * *' # UTC 时间，16:00 即北京时间 00:00

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # 赋予仓库写入权限，以便自动提交同步的文件
    permissions:
      contents: write

    steps:
      # 1. 检出当前的仓库代码
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      # 2. 检出目标源仓库 (15840213978/Release)
      - name: Checkout Source Repo
        uses: actions/checkout@v4
        with:
          repository: '15840213978/Release'
          ref: 'fongmi' # 根据你的链接，这里假设分支是 fongmi。如果不是，请自行修改
          path: 'source-temp'

      # 3. 将文件同步到本地目标文件夹
      - name: Copy APK Files
        run: |
          # 创建目标文件夹
          mkdir -p apk/fongmi
          
          # 清空旧文件并复制新文件（确保与源仓库完全同步）
          rm -rf apk/fongmi/*
          
          # 假设源仓库中的 apk 文件夹在 source-temp/apk
          # 如果源仓库的路径不同，请调整这里的源路径
          if [ -d "source-temp/apk" ]; then
            cp -r source-temp/apk/* apk/fongmi/
          else
            echo "Error: Source directory not found!"
            exit 1
          fi

      # 4. 自动提交并推送更改到你的仓库
      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync APK files from 15840213978/Release"
          branch: main # 如果你的默认分支是 master，请修改此处
          file_pattern: "apk/fongmi/*"
