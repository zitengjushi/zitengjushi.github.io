# 工作流名称：同步外部仓库内容
name: Sync External Repository

# 触发条件配置
on:
  # 定时触发：每天检查一次外部仓库的更新
  schedule:
    - cron: '0 0 * * *'  # cron表达式，格式：分钟 小时 日期 月份 星期
  # 手动触发：允许通过GitHub界面手动运行此工作流
  workflow_dispatch:

# 定义作业
jobs:
  sync:  # 作业名称
    runs-on: ubuntu-latest  # 运行环境：最新版本的Ubuntu
    steps:  # 作业步骤
      # 步骤1：检出当前仓库
      - name: Checkout your repository
        uses: actions/checkout@v4  # 使用GitHub官方的checkout动作
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # 使用GitHub自动生成的令牌进行身份验证
          fetch-depth: 0  # 检出所有历史提交，而不仅仅是最新的一个

      # 步骤2：配置Git用户信息
      - name: Set up Git
        run: |
          # 配置Git用户名和邮箱，用于后续的提交操作
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      # 步骤3：克隆目标外部仓库 (ediart/tvbox)
      - name: Clone second target repository
        uses: actions/checkout@v4
        with:
          repository: ediart/tvbox  # 目标仓库地址
          token: ${{ secrets.GITHUB_TOKEN }}
          path: synced-content-ediart  # 克隆到本地的目录名称
          fetch-depth: 1

      # 步骤4：检查外部仓库是否有内容
      - name: Check if there are files to copy in second repo
        id: check-changes-ediart
        run: |
          # 检查synced-content-ediart目录中是否有文件
          if [ "$(ls -A synced-content-ediart)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      # 步骤4.1：获取目标仓库的最后一个commit信息
      - name: Get last commit message from ediart/tvbox
        id: get-last-commit-ediart
        if: steps.check-changes-ediart.outputs.changes == 'true'
        run: |
          # 进入同步的外部仓库目录
          cd synced-content-ediart
          # 获取最后一个commit的完整信息
          LAST_COMMIT=$(git log -1 --pretty=format:"Sync ediart/tvbox: %h %s")
          # 设置为输出变量，供后续步骤使用
          echo "last_commit=$LAST_COMMIT" >> $GITHUB_OUTPUT

      # 步骤5：如果有变化，将文件复制到目标文件夹并提交
      - name: Copy files from second repo to target folder
        if: steps.check-changes-ediart.outputs.changes == 'true'
        run: |
          # 保存外部仓库的最后一个commit信息
          LAST_COMMIT="${{ steps.get-last-commit-ediart.outputs.last_commit }}"
          rm -rf synced-content-ediart/.git
          mkdir -p tvboxlist/ediart
          cp -r synced-content-ediart/* tvboxlist/ediart/
          git add tvboxlist/ediart/
          # 提交更改，使用外部仓库的最后一个commit信息
          git commit -m "$LAST_COMMIT $(date -u '+%Y-%m-%d %H:%M:%S UTC')" || echo "No changes to commit"
          git push

      # 步骤6：清理临时文件
      - name: Cleanup second repo
        run: rm -rf synced-content-ediart  # 删除克隆的外部仓库目录，清理工作区
